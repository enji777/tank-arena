<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Tank Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#101623;color:#eef4ff;font:16px system-ui;text-align:center}header{padding:12px}h1{color:#f8ce52;margin:5px}.panel{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button,input{border:1px solid #53627b;border-radius:9px;padding:12px;background:#27354d;color:white;font:inherit}button{touch-action:none}canvas{display:block;width:min(96vw,960px);aspect-ratio:3/2;margin:10px auto;border:3px solid #50617e;background:#1d2935;touch-action:none}#status{min-height:26px;margin:9px}#touch{display:flex;justify-content:space-between;max-width:650px;margin:8px auto;padding:0 12px}.pad{display:grid;grid-template-columns:repeat(3,52px);gap:3px}.pad button{width:52px;height:52px;padding:0}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}#shoot{background:#a63d39;width:90px;border-radius:50%}small{color:#aab7ca}</style></head><body><header><h1>⚔️ TANK ARENA</h1><div class="panel"><button id="solo">🤖 Против ботов</button><input id="code" placeholder="Код комнаты" maxlength="20"><button id="join">🌐 Войти / создать</button><button id="copy">🔗 Ссылка другу</button></div><div id="status">Выбери режим</div></header><canvas id="game" width="960" height="640"></canvas><div id="touch"><div class="pad"><button class="up" data-key="up">▲</button><button class="left" data-key="left">◀</button><button class="down" data-key="down">▼</button><button class="right" data-key="right">▶</button></div><button id="shoot" data-key="shoot">ОГОНЬ</button></div><small>WASD / стрелки — движение · Пробел — огонь · Поделись ссылкой с другом</small><script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
